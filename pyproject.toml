[project]
name = "fftext"
version = "0.3.0"
description = "Tiny local-LLM text helper: summarize / explain / check / translate, powered by unsloth/Qwen3.5-0.8B-GGUF."
requires-python = ">=3.9"
dependencies = [
    # 0.3.23 is the first release that bundles a llama.cpp new enough
    # to recognize the 'qwen35' GGUF architecture used by Qwen3.5 models.
    "llama-cpp-python>=0.3.23",
    "huggingface-hub>=0.24.0",
    # Web input + fact-check scraping.
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    # URL parsing for the 'web' input path.
    "readability-lxml>=0.8.1",
    "lxml>=4.9",
]

[project.scripts]
fftext = "main:main"
qwen-demo = "main:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "llm", "summarize", "explain", "check", "translate"]
